services:
  db:
    image: postgres:16-alpine
    container_name: iess_turnos_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iess_turnos_db}
      POSTGRES_USER: ${POSTGRES_USER:-iess_sec_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Iess_S3cur3_DB_2026!}
      TZ: America/Guayaquil
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-iess_sec_admin} -d $${POSTGRES_DB:-iess_turnos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - iess_internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iess_turnos_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-iess-prod-sec-key-9f8e7d6c5b4a3210-lopdp-2026-hmac-sha256}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-iess_turnos_db}
      POSTGRES_USER: ${POSTGRES_USER:-iess_sec_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Iess_S3cur3_DB_2026!}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
    networks:
      - iess_internal_net

volumes:
  postgres_data:
    driver: local

networks:
  iess_internal_net:
    driver: bridge
